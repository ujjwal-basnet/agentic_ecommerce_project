services:
  - type: web
    name: smartshop-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ── Database ──────────────────────────────────────────────────────────
      # Prefer direct connection (db.<project>.supabase.co:5432) over pooler.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      # ── File paths ────────────────────────────────────────────────────────
      - key: PRODUCTS_MD_PATH
        value: data/products.md
      - key: PRODUCT_IMAGES_DIR
        value: data/products
      - key: USER_UPLOADS_DIR
        value: data/uploads
      - key: TRYON_DIR
        value: data/tryon
      - key: CAMPAIGN_DIR
        value: data/campaigns
      - key: PROTOCOL_LOG_PATH
        value: logs/protocol_log.jsonl

      # ── Public URL (set AFTER first deploy to your Render URL) ────────────
      - key: PUBLIC_BASE_URL
        sync: false

      # ── Supabase Storage ──────────────────────────────────────────────────
      # Buckets auto-created/upserted to public on startup.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── Auth gate ─────────────────────────────────────────────────────────
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "72"

      # ── MCP server ────────────────────────────────────────────────────────
      - key: MCP_BEARER_TOKEN
        sync: false

      # ── Google Gemini ─────────────────────────────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image

      # ── Meta / Facebook / Instagram ───────────────────────────────────────
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: FB_GRAPH_VERSION
        value: v24.0
      - key: IG_USER_ID
        sync: false

      # ── Local Chat LLM (Qwen 2.5 via vLLM) ────────────────────────────
      # The FastAPI app on Render has NO GPU. Chat/planning calls are routed
      # to your local vLLM server exposed via ngrok or cloudflare tunnel.
      # Set LLM_BASE_URL to your tunnel URL after starting vLLM locally.
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_BASE_URL
        sync: false                       # e.g. https://abc123.ngrok-free.app/v1
      - key: OPENAI_MODEL
        value: Qwen/Qwen2.5-3B-Instruct-GPTQ-Int4
      - key: OPENAI_API_KEY
        value: local-dummy-key            # placeholder — vLLM doesn't check it

      # ── Vector Search / Pinecone ───────────────────────────────────────
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: ecommerce

      # ── Groq (fast rewriter) ───────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false

      # ── Image generation backends ──────────────────────────────────────
      - key: RUNPOD_API_KEY
        sync: false
      - key: RUNFLOW_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false

      # ── Observability (Logfire) ────────────────────────────────────────
      - key: LOGFIRE_TOKEN
        sync: false

      # ── SMTP (order receipts) ──────────────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
