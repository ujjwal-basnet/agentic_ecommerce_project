services:
  - type: web
    name: smartshop-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ── Database ──────────────────────────────────────────────────────────
      # Your external PostgreSQL connection string (Supabase, Neon, etc.)
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      # ── File paths ────────────────────────────────────────────────────────
      - key: PRODUCT_IMAGES_DIR
        value: data/products
      - key: USER_UPLOADS_DIR
        value: data/uploads
      - key: TRYON_DIR
        value: data/tryon
      - key: CAMPAIGN_DIR
        value: data/campaigns
      - key: PROTOCOL_LOG_PATH
        value: logs/protocol_log.jsonl

      # ── Public URL (set AFTER first deploy to your Render URL) ────────────
      - key: PUBLIC_BASE_URL
        sync: false

      # ── Supabase Storage ──────────────────────────────────────────────────
      # SUPABASE_URL: https://<project-id>.supabase.co
      # SUPABASE_SERVICE_KEY: Settings → API → service_role secret
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── MCP server ────────────────────────────────────────────────────────
      - key: MCP_BEARER_TOKEN
        sync: false

      # ── Google Gemini (API key mode — no Vertex AI) ───────────────────────
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image

      # ── Meta / Facebook / Instagram ───────────────────────────────────────
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: FB_GRAPH_VERSION
        value: v24.0
      - key: FB_VERIFY_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_VERIFY_TOKEN
        sync: false

      # ── Channel flags ─────────────────────────────────────────────────────
      - key: ENABLE_FB_MESSENGER
        value: "true"
      - key: ENABLE_INSTAGRAM
        value: "true"
      - key: ENABLE_WHATSAPP
        value: "false"

      # ── Fallback reply messages ───────────────────────────────────────────
      - key: DM_FALLBACK_REPLY
        value: "Sorry, I hit a snag. Please try again in a moment."
      - key: COMMENT_FALLBACK_REPLY
        value: "Thanks for reaching out! We'll follow up shortly."
